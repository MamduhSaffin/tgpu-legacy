<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Islamic Education Class logo</title>
  <desc id="desc">Islamic Education Class logo, since 2021.</desc>
  <rect width="500" height="500" fill="#ffffff"/>
  <circle cx="250" cy="250" r="224" fill="none" stroke="#CDA12A" stroke-width="7"/>

  <!-- Crescent and finial -->
  <circle cx="250" cy="54" r="13" fill="#CDA12A"/>
  <circle cx="256" cy="49" r="13" fill="#ffffff"/>
  <path d="M250 68 L244 82 L250 95 L256 82 Z" fill="#CDA12A"/>

  <!-- Mosque arch -->
  <path d="M69 315 H172
           C174 303 177 295 184 289
           V226
           C184 170 211 126 250 99
           C289 126 316 170 316 226
           V289
           C323 295 326 303 328 315
           H431"
        fill="none" stroke="#CDA12A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flower / heart motif -->
  <path d="M250 208 C224 181 210 155 220 135 C232 113 250 123 250 142 Z" fill="#D92C2C"/>
  <path d="M250 208 C276 181 290 155 280 135 C268 113 250 123 250 142 Z" fill="#F25C61"/>
  <path d="M250 208 C225 189 198 177 183 189 C166 203 180 225 205 225 C221 225 236 218 250 208 Z" fill="#FF6868"/>
  <path d="M250 208 C275 189 302 177 317 189 C334 203 320 225 295 225 C279 225 264 218 250 208 Z" fill="#F15B63"/>
  <path d="M250 208 C236 192 225 171 230 151 C235 132 250 132 250 154 Z" fill="#E83B3B" opacity="0.95"/>

  <!-- Typography -->
  <g fill="#087F88" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="250" y="362" font-size="32" font-weight="500" letter-spacing="1.3">ISLAMIC EDUCATION</text>
    <text x="250" y="401" font-size="34" font-weight="500" letter-spacing="2.1">CLASS</text>
    <text x="250" y="456" font-size="31" font-weight="400" letter-spacing="1.5">since 2021</text>
  </g>
  <rect x="178" y="414" width="144" height="6" rx="3" fill="#D8B200"/>
</svg>