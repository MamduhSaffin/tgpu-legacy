name: One-shot TGPU Legacy main logo integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-main-logo:
    if: github.event.head_commit.message == 'Add one-shot main TGPU Legacy logo integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved TGPU Legacy emblem to main site
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # 1) Keep all three main homepages on the same approved heritage emblem
          for filename in ('index.html', 'en.html', 'ar.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('https://tgpu.my/assets/tgpu-logo.png', 'https://tgpu.my/assets/favicon-512.png')
              text = text.replace('<link rel="preload" as="image" href="assets/tgpu-logo.png">', '<link rel="preload" as="image" href="assets/favicon-512.png">')
              path.write_text(text, encoding='utf-8')

          # 2) Add the emblem visibly beside the TGPU Legacy wordmark in header/footer
          js_path = Path('assets/legacy/site.js')
          js = js_path.read_text(encoding='utf-8')
          marker = "  const applyTgpuLegacyOfficialLogo = () => {"
          if marker not in js:
              insert_after = "  const assetVersion = '20260913-academy';\n"
              block = r'''

  const applyTgpuLegacyOfficialLogo = () => {
    if (!isLegacyHome) return;
    const addMark = (brand, footer = false) => {
      if (!brand || brand.querySelector('.tgpu-official-mark')) return;
      const img = document.createElement('img');
      img.className = 'tgpu-official-mark';
      if (footer) img.classList.add('tgpu-official-mark-footer');
      img.src = 'assets/favicon-512.png?v=20260913-heritage';
      img.alt = 'TGPU Legacy heritage emblem';
      img.width = 64;
      img.height = 64;
      brand.prepend(img);
      brand.classList.add('has-tgpu-official-mark');
    };
    addMark(document.querySelector('.site-header .brand'));
    addMark(document.querySelector('footer .footer-brand'), true);
  };

  applyTgpuLegacyOfficialLogo();
'''
              if insert_after not in js:
                  raise RuntimeError('Expected site.js insertion point not found')
              js = js.replace(insert_after, insert_after + block, 1)
              js_path.write_text(js, encoding='utf-8')

          # 3) Add contained responsive styling without redesigning the site
          css_path = Path('assets/legacy/styles.css')
          css = css_path.read_text(encoding='utf-8')
          css_marker = '/* TGPU Legacy official heritage emblem — 2026-09-13 */'
          if css_marker not in css:
              css += r'''

/* TGPU Legacy official heritage emblem — 2026-09-13 */
.site-header .brand.has-tgpu-official-mark{
  display:flex;
  align-items:center;
  gap:10px;
}
.tgpu-official-mark{
  width:54px;
  height:54px;
  flex:0 0 54px;
  object-fit:contain;
  border-radius:50%;
  background:#faf7ef;
  box-shadow:0 2px 8px rgba(20,61,45,.10);
}
.footer-brand.has-tgpu-official-mark{
  display:flex;
  align-items:center;
  gap:12px;
}
.footer-brand .tgpu-official-mark{
  width:60px;
  height:60px;
  flex-basis:60px;
  background:#faf7ef;
}
@media(max-width:700px){
  .site-header .brand.has-tgpu-official-mark{gap:7px}
  .site-header .tgpu-official-mark{width:42px;height:42px;flex-basis:42px}
  .site-header .brand-name{font-size:24px}
  .site-header .brand-name small{font-size:11px;letter-spacing:1px;margin-top:4px}
  .footer-brand .tgpu-official-mark{width:52px;height:52px;flex-basis:52px}
}
'''
              css_path.write_text(css, encoding='utf-8')

          # Guardrails
          for filename in ('index.html', 'en.html', 'ar.html'):
              text = Path(filename).read_text(encoding='utf-8')
              if 'https://tgpu.my/assets/tgpu-logo.png' in text:
                  raise RuntimeError(f'Old main logo reference remains in {filename}')
          print('Main TGPU Legacy logo integration complete.')
          PY

      - name: Commit main logo integration
        shell: bash
        run: |
          git config user.name "TGPU Legacy Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html en.html ar.html assets/legacy/site.js assets/legacy/styles.css
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Apply official TGPU Legacy emblem to main website [skip ci]"
          git push
