name: Fix social preview metadata

on:
  push:
    paths:
      - '.github/workflows/fix-social-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point home-page Open Graph and Twitter images to permanent JPEG
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('en.html'), Path('ar.html')]
          old = 'https://tgpu.my/assets/tgpu-official.svg'
          new = 'https://tgpu.my/assets/tgpu-social-preview.jpg?v=20260923-static'
          changed = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected old social-image URL not found in {path}; refusing a blind edit.')
              updated = text.replace(old, new)
              path.write_text(updated, encoding='utf-8')
              changed += 1
          print(f'Updated {changed} home-page language files.')
          PY

      - name: Commit the metadata fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en.html ar.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix WhatsApp and Open Graph preview images'
          git push
