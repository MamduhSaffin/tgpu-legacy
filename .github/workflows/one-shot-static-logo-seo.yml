name: One-shot static TGPU logo and SEO patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-main-site:
    if: github.event.head_commit.message == 'Add static TGPU logo and SEO patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make TGPU logo static and strengthen homepage crawl signals
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          homepages = ['index.html', 'en.html', 'ar.html']
          for filename in homepages:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')

              # Use the actual TGPU logo asset instead of the blank temporary favicon asset.
              text = text.replace('href="assets/favicon-512.png"', 'href="assets/tgpu-logo.png?v=20260913-mainbrand2"')

              # Put the logo directly in HTML so it renders even before JavaScript and is visible to crawlers.
              if 'class="tgpu-official-emblem"' not in text:
                  text = re.sub(
                      r'(<header class="site-header".*?<a class="brand"[^>]*>)',
                      r'\1<img class="tgpu-official-emblem" src="assets/tgpu-logo.png?v=20260913-mainbrand2" width="900" height="900" alt="TGPU Legacy — Tok Guru Pulau Ubi">',
                      text,
                      count=1,
                      flags=re.S,
                  )
                  text = re.sub(
                      r'(<a class="brand footer-brand"[^>]*>)',
                      r'\1<img class="tgpu-official-emblem" src="assets/tgpu-logo.png?v=20260913-mainbrand2" width="900" height="900" alt="TGPU Legacy — Tok Guru Pulau Ubi">',
                      text,
                      count=1,
                      flags=re.S,
                  )

              # Make the current brand hierarchy crawlable without depending on JS rewrites.
              lang = 'ar' if filename == 'ar.html' else ('en' if filename == 'en.html' else 'ms')
              academy_href = 'academy/ar.html' if lang == 'ar' else ('academy/en.html' if lang == 'en' else 'academy/')
              academy_label = 'الأكاديمية' if lang == 'ar' else 'Academy'
              learning_label = 'مركز التعلّم' if lang == 'ar' else 'Learning Hub'
              text = re.sub(r'<a href="classes(?:-en|-ar)?\.html" >(?:Kelas|Classes|الدروس)</a>', f'<a href="{academy_href}" >{academy_label}</a>', text, count=1)
              text = re.sub(r'<a href="learn(?:-en|-ar)?\.html" >(?:Pusat Ilmu|Learning Hub|مركز المعرفة)</a>', f'<a href="academy/learning-hub/" >{learning_label}</a>', text, count=1)

              p.write_text(text, encoding='utf-8')

          css = Path('assets/legacy/styles.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* Static TGPU Legacy main logo — 2026-09-13 */'
          if marker not in c:
              c += '''\n\n/* Static TGPU Legacy main logo — 2026-09-13 */\n.site-header .brand,.footer-brand{display:flex;align-items:center;gap:10px}\n.tgpu-official-emblem{width:62px;height:62px;flex:0 0 62px;object-fit:contain;object-position:center;border-radius:0;background:transparent;box-shadow:none}\n.footer-brand .tgpu-official-emblem{width:68px;height:68px;flex-basis:68px}\n@media(max-width:700px){.site-header .tgpu-official-emblem{width:52px;height:52px;flex-basis:52px}.footer-brand .tgpu-official-emblem{width:58px;height:58px;flex-basis:58px}}\n'''
              css.write_text(c, encoding='utf-8')

          # Add a WebSite entity to help Google understand the site's official name.
          js = Path('assets/legacy/site.js')
          j = js.read_text(encoding='utf-8')
          if 'tgpu-website-schema' not in j:
              schema_block = '''\n    if (!document.getElementById('tgpu-website-schema')) {\n      const schema = document.createElement('script');\n      schema.id = 'tgpu-website-schema';\n      schema.type = 'application/ld+json';\n      schema.textContent = JSON.stringify({\n        '@context': 'https://schema.org',\n        '@type': 'WebSite',\n        name: 'TGPU Legacy',\n        alternateName: 'Tok Guru Pulau Ubi Legacy',\n        url: 'https://tgpu.my/',\n        inLanguage: ['ms-MY','en','ar']\n      });\n      document.head.appendChild(schema);\n    }\n'''
              needle = "    document.title = 'TGPU Legacy | Tok Guru Pulau Ubi';\n"
              j = j.replace(needle, needle + schema_block, 1)
              js.write_text(j, encoding='utf-8')

          print('Static logo + crawlability patch complete')
          PY

      - name: Commit static logo and SEO improvements
        shell: bash
        run: |
          git config user.name "TGPU Legacy Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html en.html ar.html assets/legacy/styles.css assets/legacy/site.js
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Make TGPU main logo static and improve crawlability [skip ci]"
          git push
