name: Deploy TGPU Legacy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: approved-learning-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare approved green-gold branding and social sharing
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick

          # Use the approved green-and-gold assets already committed to this repository.
          # No temporary Drive links or live-site recovery are used here.
          test -s assets/tgpu-learning-hub-approved.png
          test -s assets/tgpu-learning-hub-approved-banner.webp
          test -s assets/legacy/hero.webp

          # Dedicated green/gold favicon derived from the approved logo.
          convert assets/tgpu-learning-hub-approved.png \
            -resize '256x256>' -background '#fffdf8' -gravity center -extent 256x256 -strip \
            assets/tgpu-learning-hub-favicon-approved-green-gold-20260923.png

          # Social card: keep the full approved 3:1 banner visible inside a 1200x630 card.
          convert assets/tgpu-learning-hub-approved-banner.webp \
            -resize '1200x630>' -background '#123b2c' -gravity center -extent 1200x630 -strip \
            assets/tgpu-learning-hub-social-preview-green-gold-20260923.png

          file assets/tgpu-learning-hub-favicon-approved-green-gold-20260923.png | grep -Eqi 'PNG image data'
          file assets/tgpu-learning-hub-social-preview-green-gold-20260923.png | grep -Eqi 'PNG image data'

          # Standardize favicons and known old social-preview URLs site-wide.
          while IFS= read -r -d '' page; do
            sed -i 's#https://mamduhsaffin.github.io/tgpu-legacy#https://tgpu.my#g' "$page"
            sed -i 's#https://tgpu.my/assets/tgpu-official.svg#https://tgpu.my/assets/tgpu-learning-hub-social-preview-green-gold-20260923.png#g' "$page"
            sed -i 's#https://tgpu.my/assets/tgpu-social-preview.jpg#https://tgpu.my/assets/tgpu-learning-hub-social-preview-green-gold-20260923.png#g' "$page"
            sed -i 's#https://tgpu.my/assets/tgpu-social-preview-green-gold.png#https://tgpu.my/assets/tgpu-learning-hub-social-preview-green-gold-20260923.png#g' "$page"
            perl -0pi -e 's#(<link[^>]+rel="(?:icon|apple-touch-icon)"[^>]+href=")((?:\.\./)*assets/)[^"]+(\")#$1$2tgpu-learning-hub-favicon-approved-green-gold-20260923.png$3#g' "$page" || true
          done < <(find . -type f -name '*.html' -print0)

          # Root homepage variants: approved banner is a clean standalone strip.
          # Preserve the original TGPU Legacy hero and its own text underneath.
          python3 <<'PY'
          from pathlib import Path
          import re

          banner = '<section class="approved-brand-banner" aria-label="TGPU approved green and gold banner"><img src="assets/tgpu-learning-hub-approved-banner.webp?v=20260923-clean2" width="1800" height="600" alt="TGPU Learning Hub — Knowledge, values and lifelong learning" fetchpriority="high" decoding="async"></section>'
          style = '<style id="approved-brand-banner-style">.approved-brand-banner{background:#fff;padding:12px 0 18px}.approved-brand-banner img{display:block;width:min(1600px,calc(100% - 24px));height:auto;aspect-ratio:3/1;object-fit:cover;margin:auto;border-radius:20px;box-shadow:0 14px 34px rgba(7,40,28,.12)}@media(max-width:640px){.approved-brand-banner{padding:8px 0 12px}.approved-brand-banner img{width:calc(100% - 12px);border-radius:14px}}</style>'
          social = 'https://tgpu.my/assets/tgpu-learning-hub-social-preview-green-gold-20260923.png?v=20260923-social2'
          favicon = 'assets/tgpu-learning-hub-favicon-approved-green-gold-20260923.png?v=20260923-favicon2'

          for filename in ['index.html', 'en.html', 'ar.html']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              # Restore the original Legacy hero if an earlier deployment substituted the Learning Hub banner.
              s = s.replace('<img class="hero-image" src="assets/tgpu-learning-hub-approved-banner.webp"', '<img class="hero-image" src="assets/legacy/hero.webp"')
              s = re.sub(r'<section class="approved-brand-banner".*?</section>', '', s, flags=re.S)
              if '<main id="main">' in s:
                  s = s.replace('<main id="main">', '<main id="main">\n' + banner, 1)
              if 'approved-brand-banner-style' not in s:
                  s = s.replace('</head>', style + '</head>', 1)
              s = re.sub(r'(<meta property="og:image" content=")[^"]+("[^>]*>)', r'\1' + social + r'\2', s, count=1)
              s = re.sub(r'(<meta name="twitter:image" content=")[^"]+("[^>]*>)', r'\1' + social + r'\2', s, count=1)
              s = re.sub(r'(<meta property="og:image:width" content=")[^"]+("[^>]*>)', r'\g<1>1200\2', s, count=1)
              s = re.sub(r'(<meta property="og:image:height" content=")[^"]+("[^>]*>)', r'\g<1>630\2', s, count=1)
              s = re.sub(r'(<link rel="icon"[^>]+href=")[^"]+("[^>]*>)', r'\1' + favicon + r'\2', s, count=1)
              s = re.sub(r'(<link rel="apple-touch-icon"[^>]+href=")[^"]+("[^>]*>)', r'\1' + favicon + r'\2', s, count=1)
              p.write_text(s, encoding='utf-8')
          PY

          # The actual Learning Hub page continues to use the approved Learning Hub banner.
          if test -s academy/learning-hub/hub-v2.css; then
            sed -i 's#../../assets/tgpu-learning-hub-approved-banner.webp?v=20260922-fixed2#../../assets/tgpu-learning-hub-approved-banner.webp?v=20260923-approved#g' academy/learning-hub/hub-v2.css
          fi

          # Guardrails against the previous messy deployment.
          grep -q 'assets/legacy/hero.webp' index.html
          grep -q '<section class="approved-brand-banner"' index.html
          grep -q 'tgpu-learning-hub-social-preview-green-gold-20260923.png' index.html
          grep -q 'tgpu-learning-hub-favicon-approved-green-gold-20260923.png' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
