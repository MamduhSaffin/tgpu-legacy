name: Deploy TGPU Legacy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: approved-learning-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and activate approved Learning Hub banner
        run: |
          set -euo pipefail

          test -s assets/tgpu-learning-hub-approved.png
          test -s assets/tgpu-learning-hub-approved-banner.webp

          file assets/tgpu-learning-hub-approved.png | grep -Eqi 'PNG image data'
          file assets/tgpu-learning-hub-approved-banner.webp | grep -Eqi 'Web/P image|WebP'

          # Use the already-approved committed artwork.
          # Do not rebuild or recompress banner assets during deployment.
          for page in index.html en.html ar.html; do
            test -s "$page"
            sed -i 's#https://tgpu.my/assets/tgpu-official.svg#https://tgpu.my/assets/tgpu-learning-hub-approved-banner.webp?v=20260922-approved-logo#g' "$page"
            sed -i 's#<meta property="og:image:width" content="512">#<meta property="og:image:width" content="1200">#g' "$page"
            sed -i 's#<meta property="og:image:height" content="512">#<meta property="og:image:height" content="675">#g' "$page"

            grep -q 'tgpu-learning-hub-approved-banner.webp' "$page"
            ! grep -q 'https://tgpu.my/assets/tgpu-official.svg' "$page"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
