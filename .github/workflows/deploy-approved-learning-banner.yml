name: Deploy TGPU Legacy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: approved-learning-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare approved green-gold branding and social preview
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick

          fetch_asset() {
            live_url="$1"
            fallback_url="$2"
            output="$3"
            if curl -fL --retry 2 --connect-timeout 10 "$live_url" -o "$output"; then
              echo "Recovered approved asset from the live site: $live_url"
            else
              echo "Seeding approved asset from the approved Drive source"
              curl -fL --retry 3 --connect-timeout 15 "$fallback_url" -o "$output"
            fi
            test -s "$output"
          }

          mkdir -p assets
          LOGO_LIVE="https://tgpu.my/assets/tgpu-learning-hub-logo-approved-green-gold-20260923.png"
          BANNER_LIVE="https://tgpu.my/assets/tgpu-learning-hub-hero-approved-green-gold-20260923.webp"
          FAVICON_LIVE="https://tgpu.my/assets/tgpu-learning-hub-favicon-approved-green-gold-20260923.png"

          LOGO_SEED='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-7f54-8211-9eba-d616f4d1bab3/raw?se=2026-09-23T01%3A08%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=cf4fa596-ec32-52b3-9eb9-f24f5074cef1&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T23%3A52%3A21Z&ske=2026-09-23T23%3A52%3A21Z&sks=b&skv=2026-02-06&sig=L9qPq31/Q1cex7%2BR3ZGtu0xdVx%2BDzdLHlXif8DKJSrI%3D'
          BANNER_SEED='https://sdmntprseasia.oaiusercontent.com/files/00000000-b8a0-8207-b6ce-5af24079a477/raw?se=2026-09-23T01%3A09%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=578a46e7-e4f5-5a26-85ca-32ba8ca82953&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T00%3A42%3A14Z&ske=2026-09-24T00%3A42%3A14Z&sks=b&skv=2026-02-06&sig=kQSyXe3fg%2BtfiJyNZe0gdr0t8gaGVdlkjk9OCg8EfrM%3D'
          FAVICON_SEED='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-41e8-8211-a08d-84cc541ffb99/raw?se=2026-09-23T01%3A09%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=dd86dc19-4376-56d1-a85a-ffc6f0b56b3c&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T00%3A42%3A21Z&ske=2026-09-24T00%3A42%3A21Z&sks=b&skv=2026-02-06&sig=sfvJCpdDyfDN4YCSyJDxGAdHHFgQLC0NrhJeWUBHA%2Bc%3D'

          fetch_asset "$LOGO_LIVE" "$LOGO_SEED" /tmp/tgpu-learning-logo-source
          fetch_asset "$BANNER_LIVE" "$BANNER_SEED" /tmp/tgpu-learning-banner-source
          fetch_asset "$FAVICON_LIVE" "$FAVICON_SEED" /tmp/tgpu-learning-favicon-source

          convert /tmp/tgpu-learning-logo-source -resize '900x900>' -strip assets/tgpu-learning-hub-logo-approved-green-gold-20260923.png
          cp assets/tgpu-learning-hub-logo-approved-green-gold-20260923.png assets/tgpu-learning-hub-approved.png
          convert /tmp/tgpu-learning-banner-source -resize '1800x600^' -gravity center -extent 1800x600 -strip -quality 88 assets/tgpu-learning-hub-hero-approved-green-gold-20260923.webp
          cp assets/tgpu-learning-hub-hero-approved-green-gold-20260923.webp assets/tgpu-learning-hub-approved-banner.webp
          convert /tmp/tgpu-learning-favicon-source -resize '256x256^' -gravity center -extent 256x256 -strip assets/tgpu-learning-hub-favicon-approved-green-gold-20260923.png
          convert assets/tgpu-learning-hub-hero-approved-green-gold-20260923.webp -resize '1200x630^' -gravity center -extent 1200x630 -strip assets/tgpu-learning-hub-social-preview-green-gold-20260923.png

          file assets/tgpu-learning-hub-approved.png | grep -Eqi 'PNG image data'
          file assets/tgpu-learning-hub-approved-banner.webp | grep -Eqi 'Web/P image|WebP'
          file assets/tgpu-learning-hub-favicon-approved-green-gold-20260923.png | grep -Eqi 'PNG image data'
          file assets/tgpu-learning-hub-social-preview-green-gold-20260923.png | grep -Eqi 'PNG image data'

          # Keep visible branding green/gold and point all favicons to the approved icon.
          while IFS= read -r -d '' page; do
            sed -i 's#https://mamduhsaffin.github.io/tgpu-legacy#https://tgpu.my#g' "$page"
            sed -i 's#https://tgpu.my/assets/tgpu-official.svg#https://tgpu.my/assets/tgpu-learning-hub-social-preview-green-gold-20260923.png#g' "$page"
            sed -i 's#https://tgpu.my/assets/tgpu-social-preview.jpg#https://tgpu.my/assets/tgpu-learning-hub-social-preview-green-gold-20260923.png#g' "$page"
            perl -0pi -e 's#(<link[^>]+rel="(?:icon|apple-touch-icon)"[^>]+href=")((?:\.\./)*assets/)[^"]+(\")#$1$2tgpu-learning-hub-favicon-approved-green-gold-20260923.png$3#g' "$page" || true
          done < <(find . -type f -name '*.html' -print0)

          # Clean homepage treatment: the approved banner is a standalone strip ABOVE the original Legacy hero.
          # Do not replace the original Legacy hero background, because that created duplicated text and a messy layout.
          python3 <<'PY'
          from pathlib import Path
          import re

          banner = '''<section class="approved-brand-banner" aria-label="TGPU Learning Hub approved green and gold banner"><img src="assets/tgpu-learning-hub-approved-banner.webp?v=20260923-clean" width="1800" height="600" alt="TGPU Learning Hub — Knowledge, values and lifelong learning" fetchpriority="high" decoding="async"></section>'''
          style = '''<style id="approved-brand-banner-style">.approved-brand-banner{background:#fff;padding:12px 0 18px}.approved-brand-banner img{display:block;width:min(1600px,calc(100% - 24px));height:auto;aspect-ratio:3/1;object-fit:cover;margin:auto;border-radius:20px;box-shadow:0 14px 34px rgba(7,40,28,.12)}@media(max-width:640px){.approved-brand-banner{padding:8px 0 12px}.approved-brand-banner img{width:calc(100% - 12px);border-radius:14px}}</style>'''
          social = 'https://tgpu.my/assets/tgpu-learning-hub-social-preview-green-gold-20260923.png'

          for filename in ['index.html', 'en.html', 'ar.html']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              # Remove any old standalone approved banner before inserting one clean copy.
              s = re.sub(r'<section class="approved-brand-banner".*?</section>', '', s, flags=re.S)
              if '<main id="main">' in s:
                  s = s.replace('<main id="main">', '<main id="main">\n' + banner, 1)
              if 'approved-brand-banner-style' not in s:
                  s = s.replace('</head>', style + '</head>', 1)
              s = re.sub(r'(<meta property="og:image" content=")[^"]+("[^>]*>)', r'\1' + social + r'\2', s, count=1)
              s = re.sub(r'(<meta name="twitter:image" content=")[^"]+("[^>]*>)', r'\1' + social + r'\2', s, count=1)
              s = re.sub(r'(<meta property="og:image:width" content=")[^"]+("[^>]*>)', r'\g<1>1200\2', s, count=1)
              s = re.sub(r'(<meta property="og:image:height" content=")[^"]+("[^>]*>)', r'\g<1>630\2', s, count=1)
              p.write_text(s, encoding='utf-8')
          PY

          # Learning Hub page itself uses the same approved hero artwork.
          if test -s academy/learning-hub/hub-v2.css; then
            sed -i 's#../../assets/tgpu-learning-hub-approved-banner.webp?v=20260922-fixed2#../../assets/tgpu-learning-hub-approved-banner.webp?v=20260923-approved#g' academy/learning-hub/hub-v2.css
          fi

          grep -q 'assets/legacy/hero.webp' index.html
          grep -q 'approved-brand-banner' index.html
          grep -q 'tgpu-learning-hub-social-preview-green-gold-20260923.png' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
