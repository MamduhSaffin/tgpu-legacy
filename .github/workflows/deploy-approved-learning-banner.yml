name: Deploy TGPU Legacy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: approved-learning-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify permanent approved branding
        run: |
          set -euo pipefail

          # Permanent approved assets only: no expiring Drive URLs and no image conversion.
          test -s assets/tgpu-learning-hub-approved.png
          test -s assets/legacy/hero.webp

          python3 <<'PY'
          from pathlib import Path

          approved = 'https://tgpu.my/assets/tgpu-learning-hub-approved.png'
          old_urls = {
              'https://tgpu.my/assets/tgpu-official.svg',
              'https://tgpu.my/assets/tgpu-social-preview.jpg',
              'https://tgpu.my/assets/tgpu-social-preview-green-gold.png',
              'https://tgpu.my/assets/tgpu-learning-hub-social-preview-green-gold-20260923.png',
          }

          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('https://mamduhsaffin.github.io/tgpu-legacy', 'https://tgpu.my')
              for old in old_urls:
                  s = s.replace(old, approved)
              p.write_text(s, encoding='utf-8')
          PY

          # Guardrails: approved green/gold logo stays visible and the original Legacy hero remains intact.
          grep -q 'assets/tgpu-learning-hub-approved.png' index.html
          grep -q 'assets/legacy/hero.webp' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
