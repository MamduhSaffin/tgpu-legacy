name: Apply official TGPU logo

on:
  push:
    paths:
      - '.github/workflows/apply-official-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point TGPU master pages to the new official logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','en.html','ar.html','assets/legacy/site.js']:
              path=Path(name)
              text=path.read_text(encoding='utf-8')
              updated=text.replace('assets/tgpu-logo.png','assets/tgpu-official.svg')
              if updated!=text:
                  path.write_text(updated,encoding='utf-8')
                  print(name)
          PY
      - name: Commit logo rollout
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'TGPU Brand Maintenance'
          git config user.email 'mamduh@tgpugulf.com'
          git add index.html en.html ar.html assets/legacy/site.js
          git commit -m 'Use official TGPU master logo across main site'
          git push origin HEAD:main
