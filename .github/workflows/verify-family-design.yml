name: Verify TGPU Legacy corporate homepage
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify multilingual homepage, metadata, assets and preserved links
        run: python3 .github/scripts/verify-legacy-home.py
      - name: Check class bookmark script syntax
        run: node --check assets/legacy-corporate.js
