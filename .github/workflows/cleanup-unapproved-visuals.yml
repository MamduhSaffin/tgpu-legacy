name: Remove unapproved TGPU Legacy visuals

on:
  push:
    paths:
      - '.github/workflows/cleanup-unapproved-visuals.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove every remaining rejected hero reference
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<link\b[^>]*href=["\']assets/legacy/hero\.webp["\'][^>]*>', '', s, flags=re.I)
              s = re.sub(r'<img\b[^>]*src=["\']assets/legacy/hero\.webp["\'][^>]*>', '', s, flags=re.I)
              s = s.replace('assets/legacy/hero.webp', '')
              p.write_text(s, encoding='utf-8')
          PY
          git rm -f --ignore-unmatch assets/legacy/hero.webp
          if grep -R --exclude-dir=.git -n 'assets/legacy/hero.webp' -- '*.html' 2>/dev/null; then
            echo 'Rejected hero reference still exists.'
            exit 1
          fi
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Remove all remaining rejected TGPU Legacy hero references'
          git push origin HEAD:main
