name: Apply approved TGPU logo family

on:
  push:
    paths:
      - '.github/workflows/apply-approved-logo-family.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Standardize TGPU logo references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or (p.parts and p.parts[0]=='.github'):
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError):
                  continue
              n=s.replace('tgpu-logo.png','tgpu-official.svg').replace('favicon-512.png','tgpu-official.svg')
              n=n.replace('TGPU Legacy logo','TGPU Learning Hub logo')
              if n!=s:
                  p.write_text(n,encoding='utf-8')
                  changed.append(str(p))
          print('\n'.join(changed))
          PY
      - name: Commit standardized logo references
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'TGPU Brand Maintenance'
          git config user.email 'mamduh@tgpugulf.com'
          git add -- ':!.github/workflows/*'
          git commit -m 'Use approved TGPU logo across public site'
          git push origin HEAD:main
