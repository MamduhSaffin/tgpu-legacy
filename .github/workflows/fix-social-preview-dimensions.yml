name: Fix social preview dimensions

on:
  push:
    paths:
      - '.github/workflows/fix-social-preview-dimensions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-preview-dimensions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correct Open Graph image metadata for the 1200x630 JPEG
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in [Path('index.html'), Path('en.html'), Path('ar.html')]:
              text = path.read_text(encoding='utf-8')
              image_line = '<meta property="og:image" content="https://tgpu.my/assets/tgpu-social-preview.jpg?v=20260923-static">'
              width_old = '<meta property="og:image:width" content="512">'
              height_old = '<meta property="og:image:height" content="512">'
              if image_line not in text:
                  raise SystemExit(f'Expected social image metadata not found in {path}')
              text = text.replace(width_old, '<meta property="og:image:width" content="1200">')
              text = text.replace(height_old, '<meta property="og:image:height" content="630">')
              type_line = '<meta property="og:image:type" content="image/jpeg">'
              if type_line not in text:
                  text = text.replace(image_line, image_line + '\n  ' + type_line)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit corrected metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en.html ar.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Correct social preview dimensions and MIME type'
          git push
