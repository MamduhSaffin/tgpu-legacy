name: Add official TGPU email

on:
  push:
    paths:
      - '.github/workflows/add-official-email.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add the official email to TGPU home footers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['index.html','en.html','ar.html']
          for name in files:
              path=Path(name)
              text=path.read_text(encoding='utf-8')
              if 'mailto:mamduh@tgpugulf.com' in text:
                  continue
              needle='</a></div><blockquote class="footer-quote">'
              if needle not in text:
                  raise SystemExit(f'Footer contact pattern not found in {name}')
              email='<a href="mailto:mamduh@tgpugulf.com" style="display:block;margin-top:12px;font-weight:800;color:#ecd69c;text-decoration:none">mamduh@tgpugulf.com</a>'
              text=text.replace(needle,'</a>'+email+'</div><blockquote class="footer-quote">',1)
              path.write_text(text,encoding='utf-8')
          PY
      - name: Commit public footer update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'TGPU Contact Maintenance'
          git config user.email 'mamduh@tgpugulf.com'
          git add index.html en.html ar.html
          git commit -m 'Add official TGPU email to public contact footer'
          git push origin HEAD:main
